events {}

http {
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        set $auth_upstream "http://auth";
        set $notification_upstream "http://notification";
        set $docs_upstream "http://docs";
        set $users_upstream "http://users-dev";

       location /users/ {
          proxy_pass         $users_upstream;
          proxy_http_version 1.1;
          proxy_set_header   Upgrade $http_upgrade;
          proxy_set_header   Connection keep-alive;
          proxy_set_header   Host $host;
          proxy_cache_bypass $http_upgrade;
          error_page 502 503 504 = @module_unavailable;
        }

        location /health {
            default_type text/plain;
            return 200;
        }

       location /auth/ {
           proxy_pass         $auth_upstream;
           proxy_http_version 1.1;
           proxy_set_header   Upgrade $http_upgrade;
           proxy_set_header   Connection keep-alive;
           proxy_set_header   Host $host;
           proxy_cache_bypass $http_upgrade;
           error_page 502 503 504 = @module_unavailable;
       }

       location /notification/ {
          allow 172.18.0.0/16;
          deny all;

          proxy_pass         $notification_upstream;
          proxy_http_version 1.1;
          proxy_set_header   Upgrade $http_upgrade;
          proxy_set_header   Connection keep-alive;
          proxy_set_header   Host $host;
          proxy_cache_bypass $http_upgrade;
          error_page 502 503 504 = @module_unavailable;
       }

      location /docs/ {
          proxy_pass $docs_upstream;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection keep-alive;
          proxy_set_header Host $host;
          proxy_cache_bypass $http_upgrade;
          error_page 502 503 504 = @module_unavailable;
      }

      location @module_unavailable {
          default_type application/json;
          return 503 '{"error": "Service unavailable", "details": "The target module is currently down or unreachable."}';
      }
    }
}
