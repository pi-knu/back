name: pi-knu-dev

services:
  postgres:
    container_name: postgres-dev
    image: postgres:16.3
    env_file:
      - ../postgres/.env
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d/
    entrypoint: >
      sh -c "chmod +x /docker-entrypoint-initdb.d/init-db.sh && exec docker-entrypoint.sh postgres"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/auth/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  auth:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: auth-dev
    working_dir: /auth
    volumes:
      - ../auth/:/auth
    command: [ "dotnet", "run", "--urls", "http://0.0.0.0", "--project", "auth/auth.csproj" ]
    env_file:
      - ../auth/.env
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/auth/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  notification:
    image: node:20
    container_name: notification-dev
    env_file: ../notification/.env
    working_dir: /app
    volumes:
      - ../notification/:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/notification/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  docs:
    image: node:20
    container_name: docs-dev
    env_file: ../docs/.env
    working_dir: /app
    volumes:
      - ../docs/:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/docs/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  migrations:
    image: python:3.11-slim
    container_name: migrations-service
    working_dir: /app
    volumes:
      - ../migration_module/:/app
    command: >
      bash -c "
        chmod +x alembic_cli.py &&
        pip install --no-cache-dir -r requirements.txt &&
        echo 'Container ready, run: python alembic_cli.py' &&
        tail -f /dev/null
      "
    networks:
      - app-network
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "echo 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      
  users:
    image: python:3.11-slim
    container_name: users-dev
    working_dir: /app
    volumes:
      - ../flask_app/:/app
    env_file:
      - ../flask_app/.env
    restart: unless-stopped
    command: >
      bash -lc "
        pip install --no-cache-dir -r requirements.txt &&
        exec python app.py
      "
    networks:
      - app-network
    depends_on:
      - postgres
      - nginx
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/users/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  lots-service:
    build:
      context: ../lots_module 
    container_name: lots-service-dev
    env_file:
      - ../lots_module/.env
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped
    volumes:
       - ../lots_module:/app 

networks:
  app-network:
    driver: bridge
